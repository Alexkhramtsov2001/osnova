name: Deploy to GitHub Pages

on:
  workflow_call:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check current main commit
        id: head
        uses: actions/github-script@v7
        with:
          script: |
            const { data } = await github.rest.git.getRef({
              ...context.repo,
              ref: 'heads/main',
            });
            const current = data.object.sha === context.sha;
            core.setOutput('current', String(current));
            if (!current) core.notice('Skipping publication: this commit is no longer HEAD of main.');

      - name: Configure GitHub Pages
        if: steps.head.outputs.current == 'true'
        uses: actions/configure-pages@v5

      - name: Deploy GitHub Pages
        if: steps.head.outputs.current == 'true'
        id: deployment
        uses: actions/deploy-pages@v4
